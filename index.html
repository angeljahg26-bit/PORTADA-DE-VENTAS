<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard Comercial · Homero Natal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --navy:#0B1F3A; --navy2:#132B4D; --blue:#2E5AAC; --blue-mid:#4C7CD6; --blue-light:#8FB2E8;
  --gray-bg:#EEF1F5; --gray-card:#FFFFFF; --gray-border:#DDE3EA; --text:#1B2733; --text-mute:#5B6B7C;
  --ink:#0B1F3A; --track:#EEF1F5; --bar-meta:#DCE6F5; --red:#C0392B; --green:#1E7A46;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--gray-bg:#0E1622;--gray-card:#17212F;--gray-border:#2A3646;--text:#E6EDF5;--text-mute:#9AA9BA;--ink:#BFD4F2;--track:#243042;--bar-meta:#2C3B52;--red:#E5766A;--green:#5CC08A;}
}
:root[data-theme="dark"]{--gray-bg:#0E1622;--gray-card:#17212F;--gray-border:#2A3646;--text:#E6EDF5;--text-mute:#9AA9BA;--ink:#BFD4F2;--track:#243042;--bar-meta:#2C3B52;--red:#E5766A;--green:#5CC08A;}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--gray-bg);color:var(--text);}
.wrap{max-width:1180px;margin:0 auto;padding:24px 18px 60px;}
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:14px;padding:22px 26px;margin-bottom:18px;}
header h1{margin:0 0 6px;font-size:1.4rem;font-weight:800;}
header p{margin:0;color:#C7D3E6;font-size:.88rem;}
.upload-panel{background:var(--gray-card);border:2px dashed var(--gray-border);border-radius:14px;padding:22px;text-align:center;margin-bottom:16px;}
.upload-panel.drag{border-color:var(--blue);}
.upload-panel p{margin:4px 0;color:var(--text-mute);font-size:.88rem;}
.btn{background:var(--blue);color:#fff;border:none;padding:9px 20px;border-radius:8px;font-weight:700;font-size:.85rem;cursor:pointer;margin-top:8px;}
.btn:hover{background:var(--navy);}
.file-input{display:none;}
.config-bar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;background:var(--gray-card);border:1px solid var(--gray-border);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:.82rem;}
.config-bar label{font-weight:700;color:var(--ink);margin-right:6px;}
.config-bar input{border:1px solid var(--gray-border);background:var(--gray-bg);color:var(--text);border-radius:6px;padding:5px 8px;font-size:.82rem;width:70px;}
.status{font-size:.85rem;padding:10px 14px;border-radius:10px;margin-bottom:16px;border:1px solid var(--gray-border);background:var(--gray-card);}
.status.ok{color:var(--green);} .status.err{color:var(--red);} .status.info{color:var(--blue-mid);}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.85rem;margin-bottom:6px;}
.crumbs button{background:var(--gray-card);border:1px solid var(--gray-border);color:var(--ink);border-radius:20px;padding:5px 12px;font-weight:700;font-size:.78rem;cursor:pointer;}
.crumbs button.cur{background:var(--navy);color:#fff;border-color:var(--navy);cursor:default;}
.crumbs span{color:var(--text-mute);}
h2.section{font-size:1.05rem;color:var(--ink);margin:22px 0 12px;font-weight:800;border-left:4px solid var(--blue);padding-left:10px;}
.hint{font-size:.78rem;color:var(--text-mute);margin:-6px 0 12px 14px;}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
.kpi{background:var(--gray-card);border:1px solid var(--gray-border);border-radius:12px;padding:14px 16px;}
.kpi .lbl{font-size:.72rem;color:var(--text-mute);font-weight:600;text-transform:uppercase;letter-spacing:.3px;}
.kpi .val{font-size:1.3rem;font-weight:800;color:var(--ink);margin-top:4px;}
.kpi .sub{font-size:.75rem;color:var(--text-mute);margin-top:2px;}
.pos{color:var(--green)!important;} .neg{color:var(--red)!important;}
.panel{background:var(--gray-card);border:1px solid var(--gray-border);border-radius:14px;padding:18px;margin-top:16px;}
.panel h3{margin:0 0 12px;font-size:.9rem;color:var(--ink);font-weight:700;}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:6px;}
.zone-card{background:var(--gray-card);border:1px solid var(--gray-border);border-radius:14px;overflow:hidden;}
.zone-card.click{cursor:pointer;transition:.12s;}
.zone-card.click:hover{border-color:var(--blue);transform:translateY(-2px);}
.zone-head{background:var(--navy);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.zone-head .ruta{font-weight:800;font-size:.95rem;}
.zone-head .emp{font-size:.68rem;color:#C7D3E6;max-width:150px;text-align:right;}
.zone-body{padding:14px 16px;}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--gray-border);font-size:.85rem;}
.row:last-child{border-bottom:none;}
.row .k{color:var(--text-mute);} .row .v{font-weight:700;color:var(--text);}
.more{margin-top:10px;font-size:.78rem;font-weight:700;color:var(--blue-mid);text-align:right;}
.bar-track{height:8px;background:var(--track);border-radius:6px;overflow:hidden;margin-top:8px;}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--blue-light));}
.footnote{font-size:.75rem;color:var(--text-mute);margin-top:18px;line-height:1.5;background:var(--gray-card);border:1px solid var(--gray-border);border-radius:10px;padding:12px 16px;}
svg .t1{fill:var(--ink);} svg .t2{fill:var(--text-mute);} svg .bm{fill:var(--bar-meta);}
#results{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Dashboard Comercial · Homero Nazir Natal Navarro</h1>
    <p>Sube el archivo “Analisis de vta” (.xlsx / .xlsm). Navega por gerente, supervisor y zona de ventas.</p>
  </header>

  <div class="config-bar">
    <div><label>Días hábiles del mes:</label><input id="cfgDias" type="number" value="22" min="1" max="31"></div>
    <div><label>Día hábil actual:</label><input id="cfgDiaActual" type="number" value="22" min="1" max="31"></div>
  </div>

  <div class="upload-panel" id="dropzone">
    <p><b>Arrastra tu archivo aquí</b> o selecciónalo</p>
    <p style="font-size:.75rem">Formatos: .xlsx, .xlsm. El procesamiento ocurre en tu navegador; el archivo no se sube a ningún servidor.</p>
    <button class="btn" type="button" onclick="document.getElementById('fileInput').click()">Seleccionar archivo</button>
    <input type="file" id="fileInput" class="file-input" accept=".xlsx,.xlsm,.xls">
  </div>

  <div id="statusBox"></div>
  <div id="results"></div>
</div>

<script>
/* ====== ESTRUCTURA DE HOMERO NATAL (Gerente → Supervisor → Rutas) ======
   Si cambia la estructura (altas, bajas, rutas que cambian de supervisor), edita este bloque.
   Las cifras siempre salen del archivo que subas; aquí solo se define quién depende de quién. */
const GERENTE_SR = 'HOMERO NAZIR NATAL NAVARRO';
const HIER = {"JORGE CARRASCO AREVALO":{"VACANTE MORELIA":["BA1013","BA1014","BA1015","BA1016","BA1017","BA1019"],"SARAHI PEÑA PRECIADO":["BVA113","BVA114","BVA119","BVA125"],"JOSE ANGEL HERNANDEZ GODIN":["BVA116","BVA117","BVA118","BVA124"],"JUAN ABRAHAM RAMON GONZALEZ GUTIERREZ":["BVA133","BVA134","BVA135","BVA136","BVA137","BVA139"],"JOSE HIGINIO MONTAÑO RODRIGUEZ":["BVA126","BVA127","BVA128","BVA129","BVA130","BVA132"],"ANGEL RODRIGUEZ MARTINEZ":["BVA102","BVA103","BVA104","BVA105","BVA106"]},"TATTIANA OLIVAS OSORIO":{"SARA LIZETTE RUIZ MAXEMIN":["BVA107","BVA109","BVA110"],"ISMAEL MUÑOZ ALVARADO":["BA1008","BA1009","BA1011"],"ELIZABETH ROCHA URIBE":["BVA108","BVA111","BVA112","BVA121"],"RAMON JANTES":["BA1001","BA1002","BA1003","BA1004"],"TATTIANA OLIVAS OSORIO":["BVAK01"]}};

const dz=document.getElementById('dropzone'), fileInput=document.getElementById('fileInput');
const statusBox=document.getElementById('statusBox'), resultsEl=document.getElementById('results');
['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('drag');}));
['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('drag');}));
dz.addEventListener('drop',e=>{if(e.dataTransfer.files.length)handleFile(e.dataTransfer.files[0]);});
fileInput.addEventListener('change',e=>{if(e.target.files.length)handleFile(e.target.files[0]);});
['cfgDias','cfgDiaActual'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{if(DATA)render();}));

const setStatus=(m,t)=>{statusBox.innerHTML='<div class="status '+t+'">'+m+'</div>';};
const norm=s=>(s===null||s===undefined)?'':s.toString().trim();
const flat=s=>norm(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const title=s=>s.toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase());
const fmt=n=>(n<0?'-$':'$')+Math.abs(Math.round(n)).toLocaleString('es-MX');
const pct=n=>n.toFixed(1)+'%';

const FIELD_DEFS={
  gsr:{exact:['gerente sr.']},
  ruta:{exact:['ruta']},
  empleado:{exact:['empleado responsable de la visita','empleado']},
  venta:{exact:['vtas mens.','vtas mens','venta mens.','venta mensual'],partial:['vtas','venta'],partialWith:'mens'},
  dev:{exact:['dev. mens.','dev mens.','devolucion mens.','devolucion'],partial:['dev'],partialWith:'mens'},
  meta:{exact:['metas','meta'],partial:['meta'],partialExclude:['alcance','cump']},
  ccv:{exact:['ccv']}, csv:{exact:['csv']}
};
function matchField(h,def){
  if(def.exact&&def.exact.some(n=>h===flat(n)))return true;
  if(def.partial&&def.partial.some(p=>h.indexOf(p)>=0)){
    if(def.partialWith&&h.indexOf(def.partialWith)<0)return false;
    if(def.partialExclude&&def.partialExclude.some(x=>h.indexOf(x)>=0))return false;
    return true;
  }
  return false;
}
function findBlock(rows,required){
  for(let i=0;i<rows.length;i++){
    const row=rows[i]||[],cm={};
    Object.keys(FIELD_DEFS).forEach(k=>{
      const idx=row.findIndex(c=>norm(c)!==''&&matchField(flat(c),FIELD_DEFS[k]));
      if(idx>=0)cm[k]=idx;
    });
    if(required.every(k=>k in cm))return {headerRow:i,cm};
  }
  return null;
}

let DATA=null, state={ger:null,sup:null}, current=[];

function handleFile(file){
  setStatus('Leyendo “'+file.name+'”…','info');
  const rd=new FileReader();
  rd.onload=e=>{try{processWorkbook(XLSX.read(e.target.result,{type:'array'}));}
    catch(err){console.error(err);setStatus('No se pudo leer el archivo. Verifica que sea un .xlsx/.xlsm válido.','err');}};
  rd.readAsArrayBuffer(file);
}

function processWorkbook(wb){
  let names=wb.SheetNames.slice();
  if(names.includes('Analisis'))names=['Analisis',...names.filter(s=>s!=='Analisis')];
  let blk=null,rows=null,sheet=null;
  for(const sn of names){
    const r=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:null,raw:true});
    const b=findBlock(r,['ruta','venta','meta','ccv','csv']);
    if(b){blk=b;rows=r;sheet=sn;break;}
  }
  if(!blk){setStatus('No encontré la tabla de rutas (columnas Ruta, Vtas mens., Metas, CCV, CSV). Verifica que sea el reporte correcto.','err');resultsEl.style.display='none';return;}
  const cm=blk.cm, rutas={};
  for(let r=blk.headerRow+1;r<rows.length;r++){
    const row=rows[r]||[], k=norm(row[cm.ruta]);
    if(!k)continue;
    if(flat(k).startsWith('total'))break;
    rutas[k.toUpperCase()]={
      empleado:cm.empleado!==undefined?norm(row[cm.empleado]):'',
      venta:Number(row[cm.venta])||0, dev:cm.dev!==undefined?(Number(row[cm.dev])||0):0,
      meta:Number(row[cm.meta])||0, ccv:Number(row[cm.ccv])||0, csv:Number(row[cm.csv])||0
    };
  }
  // Verificación: la suma de las rutas mapeadas debe coincidir con la fila de Homero en la tabla "Gerente sr."
  let pivotVenta=null;
  const gb=findBlock(rows,['gsr','venta']);
  if(gb){
    for(let r=gb.headerRow+1;r<rows.length;r++){
      const row=rows[r]||[], n=norm(row[gb.cm.gsr]);
      if(!n||flat(n).startsWith('total'))break;
      if(flat(n)===flat(GERENTE_SR)){pivotVenta=Number(row[gb.cm.venta])||0;break;}
    }
  }
  DATA={rutas,sheet,pivotVenta};
  state={ger:null,sup:null};
  const mapped=[].concat(...Object.values(HIER).map(s=>[].concat(...Object.values(s))));
  const faltan=mapped.filter(x=>!(x in rutas));
  const sumVenta=mapped.reduce((a,x)=>a+(rutas[x]?rutas[x].venta:0),0);
  let msg='Archivo procesado (hoja “'+sheet+'”).', tipo='ok';
  if(faltan.length){msg+=' No aparecen estas rutas en el archivo: '+faltan.join(', ')+'.';tipo='info';}
  if(pivotVenta!==null&&Math.abs(pivotVenta-sumVenta)>1){
    msg+=' Aviso: la venta de las rutas mapeadas ('+fmt(sumVenta)+') no coincide con la de '+title(GERENTE_SR)+' en el archivo ('+fmt(pivotVenta)+'). La estructura pudo cambiar; revisa el bloque HIER en el código.';tipo='info';
  }
  setStatus(msg,tipo);
  render();
}

function calc(z,dias,dia){
  const gap=z.venta-z.meta, alcance=z.meta?(z.venta/z.meta)*100:0;
  const efect=(z.ccv+z.csv)?(z.ccv/(z.ccv+z.csv))*100:0;
  const vdm=z.meta/dias, esp=vdm*dia, ritmoPct=esp?(z.venta/esp)*100:0;
  return {...z,gap,alcance,efect,vdm,ritmoPct};
}
function agg(codes,dias,dia,extra){
  const t={venta:0,dev:0,meta:0,ccv:0,csv:0};
  codes.forEach(c=>{const r=DATA.rutas[c];if(r)['venta','dev','meta','ccv','csv'].forEach(k=>t[k]+=r[k]);});
  return calc({...t,...extra},dias,dia);
}
const supCodes=(g,s)=>HIER[g][s];
const gerCodes=g=>[].concat(...Object.values(HIER[g]));
const allCodes=()=>[].concat(...Object.keys(HIER).map(gerCodes));

const cls=r=>r>=100?'pos':(r<80?'neg':'');
function kpiCards(d){return `
  <div class="kpi"><div class="lbl">Venta</div><div class="val">${fmt(d.venta)}</div></div>
  <div class="kpi"><div class="lbl">Meta</div><div class="val">${fmt(d.meta)}</div></div>
  <div class="kpi"><div class="lbl">GAP vs Meta</div><div class="val ${d.gap>=0?'pos':'neg'}">${fmt(d.gap)}</div></div>
  <div class="kpi"><div class="lbl">Alcance a Meta</div><div class="val">${pct(d.alcance)}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.min(d.alcance,100)}%"></div></div></div>
  <div class="kpi"><div class="lbl">Efectividad</div><div class="val">${pct(d.efect)}</div></div>
  <div class="kpi"><div class="lbl">Devolución mens.</div><div class="val neg">${fmt(d.dev)}</div></div>
  <div class="kpi"><div class="lbl">Venta Diaria Mínima</div><div class="val">${fmt(d.vdm)}</div><div class="sub">por día hábil</div></div>
  <div class="kpi"><div class="lbl">Ritmo de Venta</div><div class="val ${cls(d.ritmoPct)}">${pct(d.ritmoPct)}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.min(d.ritmoPct,100)}%"></div></div></div>`;}

function cardsHTML(items,clickable,moreLabel){
  return items.map((r,i)=>`
  <div class="zone-card ${clickable?'click':''}" ${clickable?`onclick="pick(${i})"`:''}>
    <div class="zone-head"><span class="ruta">${r.label}</span><span class="emp">${r.sub||''}</span></div>
    <div class="zone-body">
      <div class="row"><span class="k">Venta</span><span class="v">${fmt(r.venta)}</span></div>
      <div class="row"><span class="k">Meta</span><span class="v">${fmt(r.meta)}</span></div>
      <div class="row"><span class="k">GAP vs Meta</span><span class="v ${r.gap>=0?'pos':'neg'}">${fmt(r.gap)}</span></div>
      <div class="row"><span class="k">Alcance a Meta</span><span class="v">${pct(r.alcance)}</span></div>
      <div class="row"><span class="k">Efectividad</span><span class="v">${pct(r.efect)}</span></div>
      <div class="row"><span class="k">Devolución mens.</span><span class="v neg">${fmt(r.dev)}</span></div>
      <div class="row"><span class="k">Venta Diaria Mínima</span><span class="v">${fmt(r.vdm)}</span></div>
      <div class="row"><span class="k">Ritmo de Venta</span><span class="v ${cls(r.ritmoPct)}">${pct(r.ritmoPct)}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.min(r.alcance,100)}%"></div></div>
      ${clickable?`<div class="more">${moreLabel} →</div>`:''}
    </div>
  </div>`).join('');}

function alcanceChart(items){
  return items.map(r=>{const w=Math.min(r.alcance,100),over=r.alcance>=100;
    return `<div style="margin-bottom:12px;"><div style="display:flex;justify-content:space-between;font-size:.8rem;font-weight:700;margin-bottom:4px;"><span>${r.label}</span><span>${pct(r.alcance)}</span></div>
    <div class="bar-track" style="height:14px;"><div class="bar-fill" style="width:${w}%;${over?'background:linear-gradient(90deg,#1E7A46,#4C9F6E)':''}"></div></div></div>`;}).join('');}

function barChart(items){
  const W=1000,H=260,pad=50,bw=60,gap=40;
  const maxV=Math.max(...items.map(r=>r.meta))*1.1||1, sc=v=>(v/maxV)*(H-pad-30);
  let bars='';
  items.forEach((r,i)=>{const x=pad+i*(bw*2+gap),hV=sc(r.venta),hM=sc(r.meta);
    bars+=`<rect class="bm" x="${x}" y="${H-30-hM}" width="${bw}" height="${hM}" rx="4"/>
    <rect x="${x}" y="${H-30-hV}" width="${bw}" height="${hV}" fill="#2E5AAC" rx="4"/>
    <text class="t2" x="${x+bw/2}" y="${H-30-hM-8}" text-anchor="middle" font-size="10">Meta</text>
    <text class="t1" x="${x+bw/2}" y="${H-30-hV-8}" text-anchor="middle" font-size="10" font-weight="700">${(r.venta/1e6).toFixed(2)}M</text>
    <text class="t1" x="${x+bw/2}" y="${H-10}" text-anchor="middle" font-size="12" font-weight="700">${r.label}</text>`;});
  return `<svg viewBox="0 0 ${Math.max(W,pad*2+items.length*(bw*2+gap))} ${H}" style="width:100%;height:auto;max-width:${Math.max(640,items.length*130)}px;display:block;margin:0 auto;">${bars}</svg>`;
}

function pick(i){
  const it=current[i];
  if(!state.ger)state.ger=it.key; else if(!state.sup)state.sup=it.key;
  render(); window.scrollTo({top:0,behavior:'smooth'});
}
function nav(level){ if(level===0){state.ger=null;state.sup=null;} else if(level===1){state.sup=null;} render(); window.scrollTo({top:0,behavior:'smooth'}); }

function render(){
  if(!DATA)return;
  const dias=parseFloat(document.getElementById('cfgDias').value)||22;
  const dia=parseFloat(document.getElementById('cfgDiaActual').value)||dias;
  let items,total,heading,hint,list='',charts='',moreLabel='';
  const g=state.ger,s=state.sup;
  if(!g){
    items=Object.keys(HIER).map(k=>({key:k,label:title(k),sub:Object.keys(HIER[k]).length+' supervisores',...agg(gerCodes(k),dias,dia)}));
    total=agg(allCodes(),dias,dia); heading=title(GERENTE_SR)+' · Consolidado';
    hint='Toca un gerente para ver sus supervisores.'; moreLabel='Ver supervisores';
    list='<h2 class="section">Gerentes</h2><div class="hint">'+hint+'</div><div class="zones">'+cardsHTML(items,true,moreLabel)+'</div>';
    charts='<div class="panel"><h3>Alcance a la Meta (%) por gerente</h3>'+alcanceChart(items)+'</div>';
  } else if(!s){
    items=Object.keys(HIER[g]).map(k=>({key:k,label:title(k),sub:HIER[g][k].length+' zonas',...agg(supCodes(g,k),dias,dia)}));
    total=agg(gerCodes(g),dias,dia); heading='Gerente · '+title(g);
    hint='Toca un supervisor para ver sus zonas de ventas.'; moreLabel='Ver zonas';
    list='<h2 class="section">Supervisores</h2><div class="hint">'+hint+'</div><div class="zones">'+cardsHTML(items,true,moreLabel)+'</div>';
    charts='<div class="panel"><h3>Alcance a la Meta (%) por supervisor</h3>'+alcanceChart(items)+'</div>';
  } else {
    items=supCodes(g,s).map(k=>({key:k,label:k,sub:DATA.rutas[k]?title(DATA.rutas[k].empleado):'Sin datos',...agg([k],dias,dia,{})}));
    total=agg(supCodes(g,s),dias,dia); heading='Supervisor · '+title(s);
    list='<h2 class="section">Desglose por zona de ventas</h2><div class="zones">'+cardsHTML(items,false)+'</div>';
    charts='<div class="panel"><h3>Venta vs Meta por zona</h3>'+barChart(items)+'</div><div class="panel"><h3>Alcance a la Meta (%) por zona</h3>'+alcanceChart(items)+'</div>';
  }
  current=items;
  const crumbs=`<div class="crumbs">
    <button class="${!g?'cur':''}" ${!g?'':'onclick="nav(0)"'}>${title(GERENTE_SR)}</button>
    ${g?`<span>›</span><button class="${!s?'cur':''}" ${!s?'':'onclick="nav(1)"'}>${title(g)}</button>`:''}
    ${s?`<span>›</span><button class="cur">${title(s)}</button>`:''}</div>`;
  resultsEl.innerHTML=crumbs+`
    <h2 class="section">${heading}</h2>
    <div class="kpi-grid">${kpiCards(total)}</div>
    ${charts}${list}
    <div class="footnote"><b>Notas:</b> Efectividad = CCV/(CCV+CSV), ponderada al consolidar. Venta Diaria Mínima = Meta ÷ días hábiles del mes (${dias}). Ritmo de Venta = Venta acumulada ÷ (Venta Diaria Mínima × día hábil actual, hoy: ${dia}); 100% significa que va exactamente al ritmo necesario para llegar a la meta. Los totales de gerente y supervisor son la suma de sus rutas.</div>`;
  resultsEl.style.display='block';
}
